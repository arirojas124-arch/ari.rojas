services:
  - type: web
    name: ari-erp-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:api
    startCommand: npm run start --workspace @erp/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://ari-rojas.pages.dev,http://localhost:5173,http://127.0.0.1:5173
