services:
  - type: web
    name: ari-erp-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start --workspace @erp/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_REFRESH_DAYS
        value: 30
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: 10000
      - key: CORS_ORIGINS
        value: https://ari-rojas.pages.dev
