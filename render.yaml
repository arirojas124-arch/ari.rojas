services:
  - type: web
    name: ari-erp-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: 5000
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGINS
        value: https://ari-rojas.pages.dev,https://www.ari-rojas.pages.dev,http://localhost:5173,http://127.0.0.1:5173
